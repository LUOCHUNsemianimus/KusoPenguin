plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    // This decoder is published on Central. Skip NeoForge/Mojang probes for it: an
    // unreachable earlier repository otherwise stalls ordinary online build/runClient.
    exclusiveContent {
        forRepository {
            maven {
                name = 'KusoAudioMavenCentral'
                url = uri('https://repo.maven.apache.org/maven2/')
            }
        }
        filter { includeModule('javazoom', 'jlayer') }
    }
    // Optional Touhou Little Maid integration. Only this module is routed to Modrinth;
    // the JLayer repository above and the rest of the dependency graph stay untouched.
    exclusiveContent {
        forRepository {
            maven {
                name = 'KusoMaidResolution'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}
sourceSets.main.resources { exclude '**/*.bbmodel' }

// Development-only optional compatibility mods. `devCompat` is on by default so an ordinary
// `runClient` exercises the optional maid/YSM paths. Neither artifact is jarJar'd or declared in
// neoforge.mods.toml; production packaging is unchanged.
def devCompat = !project.hasProperty('devCompat')
        || project.property('devCompat').toString() == 'true'
def withMaid = project.hasProperty('withMaid')
        && project.property('withMaid').toString() == 'true'
// Keep the pinned filename out of any user profile. Override with -PysmDevJar=<path> only when
// using a different verified local copy; dev-libs/ is ignored by Git.
def devYsmJar = file(project.findProperty('ysmDevJar')
        ?: 'dev-libs/ysm-2.6.5-neoforge+mc1.21.1-release.jar')


neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

dependencies {
    jarJar(implementation("javazoom:jlayer")) {
        version {
            strictly "[1.0.1]"
            prefer "1.0.1"
        }
    }
    additionalRuntimeClasspath "javazoom:jlayer:1.0.1"

    // Compile against the optional maid API only. It is not jarJar'd, is not listed as a
    // dependency in neoforge.mods.toml, and is loaded only when the mod is actually present.
    compileOnly "maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1"
    // Optional Gecko4 API for the Iron caster bridge. Compile-only, no jarJar, no runtime
    // requirement in neoforge.mods.toml. The pinned artifact is already in the offline cache.
    compileOnly("maven.modrinth:geckolib:Grwn5rUB") { transitive = false }
    // Optional Immersive Melodies 0.8.0 instrument-pose API. No jarJar and no mods.toml
    // dependency; the outer facade links IM classes only when the mod is actually loaded.
    compileOnly("maven.modrinth:immersive-melodies:RLpigSXC") { transitive = false }
    if (devCompat || withMaid) {
        // runtimeOnly puts the artifact on the dev runtime mod classpath so NeoForge discovers
        // it as a mod; additionalRuntimeClasspath alone only supplied library classes.
        runtimeOnly "maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1"
    }
    if (devCompat) {
        // Optional Immersive Melodies dev-runtime companion for the instrument-pose bridge.
        // Dev-only: no jarJar, no mods.toml dependency, and absence keeps the old renderer.
        runtimeOnly("maven.modrinth:immersive-melodies:RLpigSXC") { transitive = false }
        // Pinned local YSM 2.6.5 dev jar. Runtime-only and dev-only: no jarJar, no mods.toml
        // dependency, and a missing file never breaks classes/build.
        runtimeOnly files(devYsmJar)
    }
}

// Production-compatible TEST launch used by the default `runClient`. The dev ModDevGradle
// JavaExec launcher is left intact for -PdevCompat=false (source hot swap / IDE debugging).
// This task is the only place that requires the ignored local config and YSM jar, so missing
// dev files never break classes/build or IDE import.
def compatPython = project.findProperty('compatPython') ?: 'python'
def compatScript = file('tools/launch_compat_client.py')
def compatConfig = file(project.findProperty('compatConfig') ?: 'dev-libs/compat-launch.json')
// Separate game dirs: compat copies jars into run/compat-client/mods, while the native
// -PdevCompat=false launch keeps run/. Sharing run/ would expose those copies to the native
// mod classpath and duplicate Kuso/YSM.
def compatGameDir = file(project.findProperty('compatGameDir') ?: 'run/compat-client')

tasks.register('runCompatClient', Exec) {
    group = 'application'
    description = 'Launch the isolated production-compatible NeoForge client (devCompat only).'
    dependsOn tasks.named('jar')
    onlyIf { devCompat }
    standardOutput = System.out
    errorOutput = System.err
    doFirst {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        if (!modJar.isFile()) {
            throw new GradleException("runCompatClient requires the built mod jar: ${modJar}")
        }
        if (!compatScript.isFile()) {
            throw new GradleException("runCompatClient launcher not found: ${compatScript}")
        }
        if (!devYsmJar.isFile()) {
            throw new GradleException(
                    "devCompat=true requires the local YSM 2.6.5 jar at ${devYsmJar}. " +
                    "Copy the verified backup there, pass -PysmDevJar=<path>, or use " +
                    "-PdevCompat=false for the native source launch.")
        }
        if (!compatConfig.isFile()) {
            throw new GradleException(
                    "runCompatClient requires the ignored local config ${compatConfig}. " +
                    "See docs/BREWING_REVIVAL.md for the four required path keys.")
        }
        def runtimeJars = configurations.runtimeClasspath.resolve()
        def maidJar = runtimeJars.find {
            it.name.contains('1.5.3-neoforge+mc1.21.1') || it.name.toLowerCase().contains('touhoulittlemaid')
        }
        if (maidJar == null || !maidJar.isFile()) {
            throw new GradleException(
                    "runCompatClient could not resolve the pinned TLM 1.5.3 runtime jar; " +
                    "use -PdevCompat=false or fix the runtime dependency resolution.")
        }
        // The native launcher does not inherit Gradle's runtimeOnly classpath. Stage the exact
        // resolved Immersive Melodies Maven artifact explicitly so default devCompat runClient
        // never depends on a one-time manual copy.
        def melodiesJar = runtimeJars.find { it.name == 'immersive-melodies-RLpigSXC.jar' }
        if (melodiesJar == null || !melodiesJar.isFile()) {
            throw new GradleException(
                    "runCompatClient could not resolve immersive-melodies-RLpigSXC.jar; " +
                    "use -PdevCompat=false or fix the optional IM runtime dependency resolution.")
        }
        commandLine compatPython, compatScript.absolutePath,
                '--config', compatConfig.absolutePath,
                '--game-dir', compatGameDir.absolutePath,
                '--mod-jar', modJar.absolutePath,
                '--maid-jar', maidJar.absolutePath,
                '--ysm-jar', devYsmJar.absolutePath,
                '--melodies-jar', melodiesJar.absolutePath
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('runCompatClient')
    // The dependency above performs the real launch. Skip the native JavaExec only after that
    // dependency has finished; with -PdevCompat=false runCompatClient is skipped and this task
    // keeps the unmodified ModDevGradle source/debug flow.
    onlyIf { !devCompat }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Include the project license and third-party notices in the standalone mod JAR.
tasks.named('processResources') {
    from('LICENSE') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}
