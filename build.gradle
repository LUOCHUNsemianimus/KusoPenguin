plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    // This decoder is published on Central. Skip NeoForge/Mojang probes for it: an
    // unreachable earlier repository otherwise stalls ordinary online build/runClient.
    exclusiveContent {
        forRepository {
            maven {
                name = 'KusoAudioMavenCentral'
                url = uri('https://repo.maven.apache.org/maven2/')
            }
        }
        filter { includeModule('javazoom', 'jlayer') }
    }
    // Optional Touhou Little Maid integration. Only this module is routed to Modrinth;
    // the JLayer repository above and the rest of the dependency graph stay untouched.
    exclusiveContent {
        forRepository {
            maven {
                name = 'KusoMaidResolution'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}
sourceSets.main.resources { exclude '**/*.bbmodel' }

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

dependencies {
    jarJar(implementation("javazoom:jlayer")) {
        version {
            strictly "[1.0.1]"
            prefer "1.0.1"
        }
    }
    additionalRuntimeClasspath "javazoom:jlayer:1.0.1"

    // Compile against the optional maid API only. It is not jarJar'd, is not listed as a
    // dependency in neoforge.mods.toml, and is loaded only when the mod is actually present.
    compileOnly "maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1"
    if (project.hasProperty('withMaid') && project.property('withMaid').toString() == 'true') {
        // runtimeOnly puts the artifact on the dev runtime mod classpath so NeoForge discovers
        // it as a mod; additionalRuntimeClasspath alone only supplied library classes.
        runtimeOnly "maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1"
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Keep decoder attribution and its source location available in the standalone mod JAR.
tasks.named('processResources') {
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}
